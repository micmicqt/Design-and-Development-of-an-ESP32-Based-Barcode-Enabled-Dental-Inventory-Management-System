[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
  rhapsodyv/ChanFatFS@0.14.0
  h2zero/NimBLE-Arduino@2.1.0
build_flags = -I$PROJECT_DIR/include
monitor_speed = 115200
upload_speed = 115200
upload_port = COM9
monitor_port = COM9
build_src_filter =
  +<main.cpp>
  +<remote_diskio.cpp>
  -<gm65_command_diagnostic.cpp>
  -<led_logic_diagnostic.cpp>

; Opt-in HTTP timing evidence for a future approved no-scan physical test.
; The default esp32dev firmware keeps this Serial instrumentation disabled.
[env:esp32dev-http-timing]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DENABLE_HTTP_SERVICE_TIMING=1

; Phase 4 Step 1 adds nonblocking local Wi-Fi and HTTP health/status endpoints
; to the verified dual-mode hardware diagnostic. The standalone GM65 diagnostic
; remains excluded. Builds do not flash the ESP32 unless upload is requested.

[env:led-diagnostic]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
  +<led_logic_diagnostic.cpp>
  -<main.cpp>
  -<remote_diskio.cpp>
  -<gm65_command_diagnostic.cpp>
