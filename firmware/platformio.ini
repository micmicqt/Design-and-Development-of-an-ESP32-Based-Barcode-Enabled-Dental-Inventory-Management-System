[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  adafruit/RTClib@2.1.4
  marcoschwartz/LiquidCrystal_I2C@1.1.4
build_src_filter =
  +<main.cpp>
  -<gm65_command_diagnostic.cpp>
  -<led_logic_diagnostic.cpp>

; Phase 4 Step 1 adds nonblocking local Wi-Fi and HTTP health/status endpoints
; to the verified dual-mode hardware diagnostic. The standalone GM65 diagnostic
; remains excluded. No upload port is configured and builds do not flash ESP32.

[env:led-diagnostic]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
  +<led_logic_diagnostic.cpp>
  -<main.cpp>
  -<gm65_command_diagnostic.cpp>
