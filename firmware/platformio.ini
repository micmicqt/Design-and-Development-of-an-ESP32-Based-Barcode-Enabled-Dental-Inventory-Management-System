[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  adafruit/RTClib@2.1.4
  marcoschwartz/LiquidCrystal_I2C@1.1.4
build_src_filter =
  +<main.cpp>
  -<gm65_command_diagnostic.cpp>

; Final Phase 3 dual-mode integrated hardware diagnostic. The proven standalone
; GM65 diagnostic remains excluded. No upload port is configured and the build
; does not flash the ESP32.
