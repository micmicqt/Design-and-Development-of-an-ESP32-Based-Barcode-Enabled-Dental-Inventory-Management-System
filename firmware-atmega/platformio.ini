[platformio]
default_envs = atmega328p

[env:atmega328p]
platform = platformio/atmelavr@5.1.0
board = ATmega328P
board_build.mcu = atmega328p
board_build.f_cpu = 16000000UL
build_flags = -std=gnu++11
; Bare-metal AVR: intentionally no framework, bootloader, COM port, or fuse settings.
; Physical Arduino-as-ISP configuration is deferred to verified bring-up.
