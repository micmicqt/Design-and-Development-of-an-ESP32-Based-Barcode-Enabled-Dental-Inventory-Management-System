[platformio]
default_envs = uno

[env:uno]
platform = platformio/atmelavr@5.1.0
board = uno
board_build.f_cpu = 16000000UL
build_flags =
  -std=gnu++11
  -I$PROJECT_DIR/include
; Bare-metal AVR application on the Uno's onboard ATmega328P.
; Use the board's normal USB/bootloader upload settings; no Arduino framework.
upload_port = COM10
