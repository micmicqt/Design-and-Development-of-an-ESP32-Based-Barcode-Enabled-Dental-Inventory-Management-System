appId: com.anytimedental.inventorysystem
productName: Any Time Dental Inventory System
executableName: Any Time Dental Inventory System
copyright: Copyright © 2026 Any Time Dental
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - '!out/**/*.map'
asar: true
asarUnpack:
  - '**/*.node'
# better-sqlite3 13 ships a Windows N-API prebuild, verified with Electron
# 44 against an in-memory SQLite query. Avoid node-gyp rebuilding in this
# workspace path (spaces) and keep that tested prebuild in the installer.
npmRebuild: false
win:
  target: nsis
  icon: build/icon.ico
  artifactName: Any-Time-Dental-Inventory-System-Setup-${version}.${ext}
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
